name: CI

# ビルド (通常 / テスト入りの両方) と、テスト入り ISO の QEMU ヘッドレス実行。
# ローカルの検証手順をそのまま CI に移したもの:
#   1. make iso と make TESTS=1 iso を両方ビルドして、error と
#      「ほぼ確実にバグ」な警告 (-Wreturn-type / -Wuninitialized) を弾く
#   2. テスト入り ISO を QEMU で動かして、シリアル出力のマーカーと
#      例外ログ (-d int,cpu_reset) を確認する
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同じブランチへ連続 push したら古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # 既定の bash -e と違い pipefail が付く (make 2>&1 | tee の rc を拾うため)

jobs:
  build:
    name: build (kernel / tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # grub-mkrescue は grub-common、BIOS 用モジュールは grub-pc-bin、
      # ISO 作成に xorriso と mtools が必要。
      - name: ツールチェインを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ binutils nasm grub-common grub-pc-bin xorriso mtools

      - name: バージョン確認
        run: |
          g++ --version | head -1
          nasm -v
          grub-mkrescue --version

      - name: 通常カーネル (make iso)
        run: make iso 2>&1 | tee build-kernel.log

      - name: テスト入り (make TESTS=1 iso)
        run: make TESTS=1 iso 2>&1 | tee build-tests.log

      # "error:" だけを見ると fatal error: やリンクエラーを取りこぼす。
      # -Wreturn-type / -Wuninitialized は Makefile 側で -Werror= 指定済みだが、
      # 指定が外れたときに素通りしないよう、ここでも error と同じ扱いで弾く。
      - name: ビルドログのゲート
        run: |
          pattern='(fatal )?error:|undefined reference|\*\*\*|\[-Wreturn-type\]|\[-Wuninitialized\]'
          if grep -nE "$pattern" build-kernel.log build-tests.log; then
            echo "::error::ビルドログに error もしくは要注意の警告がある"
            exit 1
          fi
          echo "ビルドログに error / 要注意の警告は無し"

      - name: ISO ができているか
        run: |
          test -s unixv6.iso
          test -s unixv6-tests.iso
          ls -l unixv6.iso unixv6-tests.iso
          size build/kernel/kernel.elf build/tests/kernel.elf

      - name: テスト入り ISO を次のジョブへ渡す
        uses: actions/upload-artifact@v4
        with:
          name: unixv6-tests-iso
          path: unixv6-tests.iso
          retention-days: 7

      - name: ビルドログを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-*.log
          retention-days: 7

  qemu-tests:
    name: qemu (tests ISO)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # fs.img を Makefile のルールで作るため

      - name: QEMU を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          qemu-system-x86_64 --version | head -1

      - name: テスト入り ISO を取得
        uses: actions/download-artifact@v4
        with:
          name: unixv6-tests-iso

      # fs.img は生成物。未フォーマットの状態から起動すると、カーネルが
      # 自分で [FS] not formatted → format する (そこも含めて検証になる)。
      - name: fs.img を作る
        run: |
          make fs.img
          ls -l fs.img

      # カーネルは最後に hlt ループへ入って自分では終了しないので、
      # 最終テストのマーカーが出た時点で QEMU を止める。
      # ランナーに /dev/kvm は無いので TCG (エミュレーション) で動く。
      - name: QEMU ヘッドレス実行
        run: |
          timeout -s TERM 300 qemu-system-x86_64 \
            -cdrom unixv6-tests.iso -boot d -m 256M \
            -display none -no-reboot \
            -serial file:serial.log \
            -d int,cpu_reset -D qemu-int.log \
            -drive file=fs.img,format=raw,if=none,id=disk0 \
            -device virtio-blk-pci,drive=disk0,disable-modern=on &
          qemu_pid=$!

          for _ in $(seq 1 300); do
            if grep -q 'restore original: OK' serial.log 2>/dev/null; then
              echo "最終マーカーを検出"
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU が自分で終了した"
              break
            fi
            sleep 1
          done

          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true

          echo '----- serial.log -----'
          cat serial.log || true

      - name: シリアル出力を判定
        run: |
          test -s serial.log || { echo "::error::serial.log が空 (起動していない)"; exit 1; }

          # 各テストが「通ったときだけ出す」行。アドレスや pid は実行ごとに変わるので正規表現で。
          required=(
            '\[HIGH\] VGA via direct map OK'
            '\[PMM\].*free\+realloc:.*OK'
            '\[HEAP\].*reuse=OK'
            '\[THREAD-B\] iteration 2'
            'SEPARATED-OK'
            'WOKE-OK'
            '\[FORK\] parent: child [0-9]+ exited with code 42'
            'FORK-OK'
            '\[FREE\] destroy_address_space: OK'
            '\[FREE\] fork\+wait loop: OK'
            '\[BCACHE\] BufferRef leak test: OK'
            '\[VIRTIO\] 1024 sequential reads: OK'
            '\[VIRTIO\] write \+ read back: OK'
            '\[VIRTIO\] restore original: OK'
          )
          missing=0
          for re in "${required[@]}"; do
            if grep -qE "$re" serial.log; then
              echo "  OK      $re"
            else
              echo "::error::シリアル出力に出ていない: $re"
              missing=1
            fi
          done

          # 失敗を表す行 (NG / FAILED / ... failed / panic) が 1 行でもあれば落とす。
          if grep -nE 'FAILED|[Ff]ailed|-NG|: NG|NG before=|[Pp]anic' serial.log; then
            echo "::error::シリアル出力に失敗の行がある"
            missing=1
          fi

          exit "$missing"

      # v=00〜v=1f は CPU 例外。正常なら 1 つも出ない。
      # CPU Reset は起動時の 2 回が正常 (3 回目以降はトリプルフォルト等)。
      - name: 例外ログを判定
        run: |
          test -s qemu-int.log || { echo "::error::qemu-int.log が無い"; exit 1; }
          exceptions=$(grep -cE 'v=[0-1][0-9a-f] ' qemu-int.log || true)
          resets=$(grep -c 'CPU Reset' qemu-int.log || true)
          echo "CPU 例外: ${exceptions} / CPU Reset: ${resets}"
          rc=0
          if [ "$exceptions" -ne 0 ]; then
            grep -nE 'v=[0-1][0-9a-f] ' qemu-int.log | head -20
            echo "::error::CPU 例外が ${exceptions} 件出ている"
            rc=1
          fi
          if [ "$resets" -gt 2 ]; then
            echo "::error::CPU Reset が ${resets} 回 (正常は起動時の 2 回)"
            rc=1
          fi
          exit "$rc"

      - name: 実行ログを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: |
            serial.log
            qemu-int.log
          retention-days: 7
